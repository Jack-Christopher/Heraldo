services:
  mongodb:
    image: mongo:7
    container_name: heraldo-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-heraldo_admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD required}
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-heraldo_admin}:${MONGO_ROOT_PASSWORD}@localhost:27017/admin
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "sh", "-c", "mongosh \"$$MONGO_URI\" --quiet --eval 'db.adminCommand(\"ping\").ok'"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: heraldo-api
    ports:
      - "5001:5001"
    environment:
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-heraldo_admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/heraldo?authSource=admin
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - FLASK_ENV=production
      - OUTPUTS_DIR=/app/outputs
      - UPLOADS_DIR=/app/uploads
      - TTS_ENGINE=${TTS_ENGINE:-gtts}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MAX_PAGES=${DEEPSEEK_MAX_PAGES:-}
      - DEEPSEEK_MAX_TOKENS=${DEEPSEEK_MAX_TOKENS:-}
    volumes:
      - heraldo_outputs:/app/outputs
      - heraldo_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  react:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: heraldo-frontend
    ports:
      - "3001:3001"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongodb_data:
  heraldo_outputs:
  heraldo_uploads:
